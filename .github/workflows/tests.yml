name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest -q
      - run: python revenue-reconciliation/reconcile.py
      - run: python llm-eval-harness/evals.py --source recorded:haiku_prompt_v1 --source recorded:haiku_prompt_v2
